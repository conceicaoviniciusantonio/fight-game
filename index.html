<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d17">
<title>Crônicas de Vallen</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
</div>

<div id="touch" hidden>
  <div class="dpad">
    <button data-act="up" class="up" aria-label="Cima">▲</button>
    <button data-act="left" class="left" aria-label="Esquerda">◀</button>
    <button data-act="right" class="right" aria-label="Direita">▶</button>
    <button data-act="down" class="down" aria-label="Baixo">▼</button>
  </div>
  <div class="acts">
    <button data-act="skill1" class="s1" aria-label="Especial 1">1</button>
    <button data-act="skill2" class="s2" aria-label="Especial 2">2</button>
    <button data-act="attack confirm" class="atk" aria-label="Atacar">⚔</button>
    <button data-act="jump" class="jmp" aria-label="Pular">⤒</button>
  </div>
  <div class="tops">
    <button data-act="back" aria-label="Voltar">✕</button>
    <button data-act="pause" aria-label="Pausar">II</button>
  </div>
</div>

<div id="lobby" hidden>
  <h2 id="lobbyTitle">PvP Online</h2>
  <p class="sub" id="lobbySub">Lute contra um amigo em outro navegador</p>
  <div id="hostArea">
    <button id="btnHost">Criar sala</button>
    <div id="hostInfo" hidden>
      <div>Código da sala:</div>
      <div class="code" id="roomCode">····</div>
      <small>Envie este código para seu amigo e aguarde…</small>
    </div>
  </div>
  <div class="or" id="orSep">— ou entre na sala de um amigo —</div>
  <div class="row" id="joinRow"><input id="joinCode" maxlength="4" placeholder="CÓDIGO" autocomplete="off" aria-label="Código da sala"><button id="btnJoin">Entrar</button></div>
  <p id="lobbyStatus"></p>
  <button id="btnBack" class="ghost">Voltar ao menu</button>
</div>

<div id="rotate">Gire o celular na horizontal para jogar ↻</div>

<script src="js/util.js"></script>
<script src="js/settings.js"></script>
<script src="js/input.js"></script>
<script src="js/audio.js"></script>
<script src="js/world.js"></script>
<script src="js/heroes.js"></script>
<script src="js/player.js"></script>
<script src="js/enemies.js"></script>
<script src="js/stages.js"></script>
<script src="js/render.js"></script>
<script src="js/net.js"></script>
<script src="js/pvp.js"></script>
<script src="js/menus.js"></script>
<script src="js/game.js"></script>
</body>
</html>
