<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d17">
<title>Crônicas de Vallen</title>
<!-- bump ?v= on every release so browsers fetch the new files instead of cached ones -->
<link rel="stylesheet" href="css/style.css?v=27">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
</div>

<div id="touch" hidden>
  <div class="dpad">
    <button data-act="up" class="up" aria-label="Cima">▲</button>
    <button data-act="left" class="left" aria-label="Esquerda">◀</button>
    <button data-act="right" class="right" aria-label="Direita">▶</button>
    <button data-act="down" class="down" aria-label="Baixo">▼</button>
  </div>
  <div class="acts">
    <button data-act="skill1" class="s1" aria-label="Especial 1">1</button>
    <button data-act="skill2" class="s2" aria-label="Especial 2">2</button>
    <button data-act="skill3" class="s3" aria-label="Especial 3">3</button>
    <button data-act="dodge" class="dg" aria-label="Esquiva">↻</button>
    <button data-act="guard" class="gd" aria-label="Defesa">⛨</button>
    <button data-act="attack confirm" class="atk" aria-label="Atacar">⚔</button>
    <button data-act="jump" class="jmp" aria-label="Pular">⤒</button>
  </div>
  <div class="tops">
    <button id="emoteToggle" aria-label="Emotes">💬</button>
    <button data-act="back" aria-label="Voltar">✕</button>
    <button data-act="pause" aria-label="Pausar">II</button>
  </div>
  <div class="emotes" id="emoteBar" hidden>
    <button data-act="emote1">GG!</button><button data-act="emote2">Valeu!</button>
    <button data-act="emote3">Cuidado!</button><button data-act="emote4">Haha!</button>
  </div>
</div>

<div id="lobby" hidden>
  <h2 id="lobbyTitle">PvP Online</h2>
  <p class="sub" id="lobbySub">Lute contra um amigo em outro navegador</p>
  <div id="hostArea">
    <button id="btnHost">Criar sala</button>
    <div id="hostInfo" hidden>
      <div>Código da sala:</div>
      <div class="code" id="roomCode">····</div>
      <small>Envie este código para seu amigo e aguarde…</small>
    </div>
  </div>
  <div class="opts" id="pvpOpts">
    <label>Partida <select id="optRounds"><option value="1">Melhor de 1</option><option value="3" selected>Melhor de 3</option><option value="5">Melhor de 5</option></select></label>
    <label>Tempo <select id="optTime"><option value="60">60 s</option><option value="99" selected>99 s</option><option value="0">Sem limite</option></select></label>
    <label>Arena <select id="optArena"></select></label>
  </div>
  <div class="or" id="orSep">— ou entre na sala de um amigo —</div>
  <div class="row" id="joinRow"><input id="joinCode" maxlength="4" placeholder="CÓDIGO" autocomplete="off" aria-label="Código da sala"><button id="btnJoin">Entrar</button></div>
  <p id="lobbyStatus"></p>
  <button id="btnBack" class="ghost">Voltar ao menu</button>
</div>

<div id="rotate">Gire o celular na horizontal para jogar ↻</div>

<script src="js/util.js?v=27"></script>
<script src="js/settings.js?v=27"></script>
<script src="js/input.js?v=27"></script>
<script src="js/audio.js?v=27"></script>
<script src="js/world.js?v=27"></script>
<script src="js/heroes.js?v=27"></script>
<script src="js/player.js?v=27"></script>
<script src="js/enemies.js?v=27"></script>
<script src="js/stages.js?v=27"></script>
<script src="js/themes.js?v=27"></script>
<script src="js/stages/vallen.js?v=27"></script>
<script src="js/stages/brasilis.js?v=27"></script>
<script src="js/progress.js?v=27"></script>
<script src="js/render.js?v=27"></script>
<script src="js/net.js?v=27"></script>
<script src="js/pvp.js?v=27"></script>
<script src="js/coop.js?v=27"></script>
<script src="js/menus.js?v=27"></script>
<script src="js/game.js?v=27"></script>
<script src="js/admin.js?v=27"></script>
</body>
</html>
